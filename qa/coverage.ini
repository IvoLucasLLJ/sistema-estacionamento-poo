[run]
branch = True
relative_files = True
source = .
omit =
    tests/*
    qa/*
    .venv/*
    */site-packages/*
patch = subprocess
parallel = True

[report]
include_namespace_packages = True
include =
    main.py
    iniciar_move.py
    model/*
    view/*
    controller/*
    repository/*
    service/*
    persistence/*
    web/*
