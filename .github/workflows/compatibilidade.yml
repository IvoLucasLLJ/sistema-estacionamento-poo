name: Compatibilidade do MOVE
on:
  push:
    branches: [trabalho-final]
  workflow_dispatch:
  pull_request:
    branches: [trabalho-final]
permissions:
  contents: read

jobs:
  compatibilidade:
    # Runners padrão são gratuitos em repositórios públicos.
    if: github.event.repository.visibility == 'public'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm, windows-2025, macos-15-intel, macos-15]
        python: ['3.12', '3.14']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      PYTHONUTF8: '1'
      PIP_DISABLE_PIP_VERSION_CHECK: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python }}
      - name: Extrair o código e executar a suíte pelo inicializador nativo
        shell: python
        run: |
          import os, platform, subprocess, sys, tempfile, zipfile
          from pathlib import Path
          temporaria = Path(os.environ['RUNNER_TEMP'])
          pacote = temporaria / 'MOVE.zip'
          raiz = temporaria / 'MOVE acadêmico'
          subprocess.run(['git', 'archive', '--format=zip', '-o', str(pacote), 'HEAD'], check=True)
          raiz.mkdir()
          if sys.platform == 'darwin':
              subprocess.run(['ditto', '-x', '-k', pacote, raiz], check=True)
          elif os.name == 'nt':
              with zipfile.ZipFile(pacote) as arquivo:
                  arquivo.extractall(raiz)
          else:
              subprocess.run(['unzip', '-q', pacote, '-d', raiz], check=True)
          with open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8') as ambiente:
              print(f'MOVE_CI_PASTA={raiz}', file=ambiente)
          entrada = {'Windows': 'INICIAR_MOVE_WINDOWS.cmd', 'Darwin': 'INICIAR_MOVE_MAC.command',
                     'Linux': 'INICIAR_MOVE_LINUX.sh'}[platform.system()]
          print(platform.platform(), platform.machine(), sys.version, flush=True)
          with tempfile.TemporaryDirectory() as outra:
              subprocess.run([str(raiz / entrada), '--help'], cwd=outra, check=True,
                             env={**os.environ, 'MOVE_PYTHON': sys.executable})
          python = raiz / '.venv' / ('Scripts/python.exe' if os.name == 'nt' else 'bin/python')
          subprocess.run([python, '-m', 'pip', 'check'], check=True)
          subprocess.run([python, '-B', '-m', 'unittest', 'discover', '-s', 'tests', '-v'], cwd=raiz, check=True)
          subprocess.run([python, '-B', '-m', 'tests.ensaio_pacote', str(raiz / entrada)], cwd=raiz, check=True)
      - name: Testar os portais no Chrome e perfis móveis no WebKit do macOS
        if: runner.os == 'macOS' && matrix.python == '3.12'
        shell: bash
        run: |
          cd "$MOVE_CI_PASTA"
          python=.venv/bin/python
          "$python" -m pip install 'playwright==1.64.1'
          "$python" -m playwright install webkit
          chrome="/Applications/Google Chrome.app/Contents/MacOS/Google Chrome"
          "$python" -B -m tests.navegador_08a --chrome "$chrome" --webkit
          "$python" -B -m tests.navegador_08c --chrome "$chrome"
